name: Hydria free neural French voice
on:
  push:
    branches:
      - video/hydria-neural-narration-20261021
    paths:
      - .github/workflows/hydria-neural-voice.yml
      - tools/video/hydria_neural_voice.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free voice client
        run: python -m pip install --disable-pip-version-check 'edge-tts>=7.0,<9' 'mutagen>=1.46'
      - name: Generate 15 French neural narration scenes
        run: python tools/video/hydria_neural_voice.py
      - name: Upload audio and timings
        uses: actions/upload-artifact@v4
        with:
          name: hydria-neural-fr-narration
          path: dist/hydria-voice/
          if-no-files-found: error
          retention-days: 7
