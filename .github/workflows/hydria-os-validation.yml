name: Hydria OS integration validation
on:
  push:
    branches:
      - integration/harmonisation-2026-10-15
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle frontend and validate module exports
        run: npx --yes esbuild@0.25.10 frontend/app.js --bundle --format=esm --platform=browser --outfile=/tmp/hydria-integration.js
      - name: Hydria Drive library model and safe routing
        run: node backend/scripts/osDriveWorkspaceGate.mjs
      - name: Global native PDF/Photo/Fig Drive search normalization
        run: node backend/scripts/osDriveAssetSearchGate.mjs
      - name: Check JavaScript syntax for integrated files
        run: |
          for file in frontend/app.js frontend/components/workspaceCanvasPanel.js frontend/components/workspacePanel.js frontend/components/workspaceMenuUi.js backend/server.js backend/routes/canvas.js; do
            node --check "$file"
          done
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Audit security and data integrity regressions
        run: node backend/scripts/auditSecurityGate.mjs
      - name: Workspace action approval HTTP regression
        run: node backend/scripts/osActionConsentGate.mjs
      - name: Dependency security
        run: npm audit --prefix backend --audit-level=high
      - name: PDF reader offset and attachment regression
        run: node backend/scripts/osPdfReaderGate.mjs
      - name: Validate PdfCraft integration contract and pinned installer
        run: node backend/scripts/osPdfCraftGate.mjs
      - name: Legacy PDF revision migration
        run: node backend/scripts/osDrivePdfMigrationGate.mjs
      - name: Verify authentic PdfCraft installation
        run: node backend/scripts/installPdfCraft.mjs
      - name: Validate PhotoCraft/FigCraft releases and raster types
        run: node backend/scripts/osArtCraftGate.mjs
      - name: Legacy PhotoCraft Drive image migration and idempotency
        run: node backend/scripts/osDriveImageMigrationGate.mjs
      - name: Verify authentic PhotoCraft and FigCraft WASM installations
        run: |
          node backend/scripts/installArtCraftWeb.mjs photo
          node backend/scripts/installArtCraftWeb.mjs fig
          test -s frontend/vendor/photocraft/index.html
          test -s frontend/vendor/figcraft/index.html
      - name: Production frontend bundle preserves official ArtCraft runtimes
        run: |
          node backend/scripts/buildFrontend.mjs
          diff --recursive frontend/vendor frontend-dist/vendor
      - name: Database volume and frontend readiness diagnostics
        run: node backend/scripts/osReadinessGate.mjs
      - name: Production single-user authentication and origin checks
        run: node backend/scripts/productionAccessGate.mjs
      - name: Embedded CRM upstream proxy security and timeout regression
        run: node backend/scripts/crmProxyGate.mjs
      - name: Zoom-aware node placement and fit geometry
        run: node backend/scripts/osFlowCanvasGeometryGate.mjs
      - name: Online WAL backup integrity and clean restore
        run: node backend/scripts/osBackupGate.mjs
      - name: Drive PDF and image binary integrity across backup and restore
        run: node backend/scripts/osDriveAssetIntegrityGate.mjs
      - name: Production boot and restart persistence
        run: node backend/scripts/productionBootGate.mjs
      - name: Core adapter smoke
        run: npm run smoke:hydria-core-adapter --prefix backend
      - name: Data-flow engine operations
        run: node backend/scripts/dataFlowGate.mjs
      - name: Managed API HTTPS source validation
        run: node backend/scripts/flowApiSourceGate.mjs
      - name: PostgreSQL safe read connector validation
        run: node backend/scripts/flowPostgresSourceGate.mjs
      - name: Flow SQLite source and permission limits
        run: node backend/scripts/flowSqliteSourceGate.mjs
      - name: Flow to native Sheets and Dashboard integration
        run: node backend/scripts/osFlowPublicationGate.mjs
      - name: Flow persisted snapshots and retention
        run: node backend/scripts/flowResultSnapshotGate.mjs
      - name: Flow scheduler execution, pause and retention
        run: node backend/scripts/flowSchedulerGate.mjs
      - name: Live Flow dashboard grouping and filtering
        run: node backend/scripts/flowDashboardGate.mjs
      - name: Workspace tool integration
        run: npm run gate:workspace --prefix backend
      - name: Work objects and revision history
        run: npm run gate:work-object-library --prefix backend
      - name: Collaboration and formulas
        run: npm run gate:collaboration-formulas --prefix backend
      - name: Hydria interactions API
        run: npm run gate:hydria-interactions --prefix backend
      - name: Launch Hydria OS and verify Canvas PDF API
        run: |
          HYDRIA_FLOW_CONNECTOR_TOKEN=ci-flow-results-token npm run start --prefix backend > /tmp/hydria-os.log 2>&1 &
          alive=false
          for i in {1..25}; do
            if curl --silent --fail http://127.0.0.1:3001/api/health >/dev/null; then
              alive=true
              break
            fi
            sleep 1
          done
          if [ "$alive" != "true" ]; then cat /tmp/hydria-os.log; exit 1; fi
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const response = await fetch("http://127.0.0.1:3001/api/canvas/export-pdf", {
            method:"POST",
            headers:{"content-type":"application/json"},
            body:JSON.stringify({title:"Hydria Canvas CI",elements:[{id:"e1",type:"note",x:40,y:50,width:250,height:130,title:"Note",body:"Canvas PDF export"}]})
          });
          assert.equal(response.status, 200);
          assert.equal((response.headers.get("content-type")||"").startsWith("application/pdf"), true);
          const bytes=new Uint8Array(await response.arrayBuffer());
          assert.equal(new TextDecoder().decode(bytes.slice(0,4)),"%PDF");
          console.log("Hydria Canvas API PDF export verified; bytes:",bytes.length);
          '

      - name: Persist, retrieve and validate PDF assets in Drive
        run: node backend/scripts/osDrivePdfAssetsGate.mjs
      - name: Native Drive renames retain immutable revisions and reject stale updates
        run: node backend/scripts/osDriveRenameGate.mjs
      - name: Persist, preview and validate images in Drive
        run: node backend/scripts/osDriveImageAssetsGate.mjs
      - name: Native FigCraft project storage, revisions and safe ZIP upload
        run: node backend/scripts/osDriveDesignAssetsGate.mjs
      - name: Native PhotoCraft layered projects and immutable Drive revisions
        run: node backend/scripts/osDrivePhotoProjectsGate.mjs
      - name: Verify live Flow dashboard assets
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/flow-dashboard.html | grep -q 'Live Flow Dashboard'
          curl --fail --silent --show-error http://127.0.0.1:3001/components/flowDashboardView.js | grep -q 'aggregateSnapshotRows'
      - name: Export full data-flow results through HTTP
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const flow = {
            stages:[
              {id:"src",type:"input.table",config:{data:JSON.stringify([{city:"Paris",sales:1},{city:"Paris",sales:2},{city:"Lyon",sales:3}])}},
              {id:"sink",type:"output.table",config:{}}
            ],
            links:[{id:"e1",from:"src",to:"sink",toPort:0}]
          };
          const response = await fetch("http://127.0.0.1:3001/api/flows/export", {
            method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({flow})
          });
          assert.equal(response.status,200);
          assert.match(response.headers.get("content-type")||"",/text\/csv/);
          const body=await response.text();
          assert.match(body,/city,sales/);
          assert.equal(body.trim().split("\r\n").length,4);
          console.log("Full CSV export verified");
          '
      - name: Validate authenticated Flow snapshot API
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:3001/api/flows/snapshots";
          const flowKey = "11111111-1111-4111-8111-111111111111";
          const flow = {
            stages:[
              {id:"src",type:"input.table",config:{data:JSON.stringify([{city:"Paris",count:2}])}},
              {id:"out",type:"output.table",label:"Result table",config:{}}
            ],
            links:[{id:"edge",from:"src",to:"out",toPort:0}]
          };
          const unauthorized = await fetch(base + "/" + flowKey);
          assert.equal(unauthorized.status, 403);
          const headers = {"content-type":"application/json","x-hydria-flow-token":"ci-flow-results-token"};
          const created = await fetch(base,{method:"POST",headers,body:JSON.stringify({flow,historyId:flowKey,outputId:"out"})});
          assert.equal(created.status,201);
          const saved = await created.json();
          assert.equal(saved.snapshot.rowCount,1);
          const listResponse = await fetch(base + "/" + flowKey,{headers});
          assert.equal(listResponse.status,200);
          assert.equal((await listResponse.json()).snapshots.length,1);
          const opened = await fetch(base + "/" + flowKey + "/" + saved.snapshot.id,{headers});
          assert.equal(opened.status,200);
          assert.deepEqual((await opened.json()).snapshot.rows,[{city:"Paris",count:2}]);
          const removed = await fetch(base + "/" + flowKey + "/" + saved.snapshot.id,{method:"DELETE",headers});
          assert.equal(removed.status,200);
          const notFound = await fetch(base + "/" + flowKey + "/" + saved.snapshot.id,{headers});
          assert.equal(notFound.status,404);
          console.log("Flow snapshots API save/list/read/delete and access restriction verified.");
          '
      - name: Validate Flow scheduling HTTP API
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:3001/api/flows/schedules";
          const key = "11111111-1111-4111-8111-111111111111";
          const flow = {
            stages: [{id:"src",type:"input.table",config:{data:"[{\"n\":3}]"}},
                     {id:"out",type:"output.table"}],
            links: [{id:"edge",from:"src",to:"out",toPort:0}]
          };
          const headers = {"content-type":"application/json","x-hydria-flow-token":"ci-flow-results-token"};
          assert.equal((await fetch(base)).status,403);
          const create = await fetch(base+"/"+key,{
            method:"PUT",headers,body:JSON.stringify({flow,outputId:"out",intervalMinutes:15})
          });
          assert.equal(create.status,200);
          assert.equal((await create.json()).schedule.enabled,true);
          const listed = await fetch(base,{headers});
          assert.equal((await listed.json()).schedules.length,1);
          const run = await fetch(base+"/"+key+"/run",{method:"POST",headers});
          assert.equal(run.status,200);
          assert.equal((await run.json()).result.outputRows,1);
          const disabled = await fetch(base+"/"+key,{
            method:"PUT",headers,body:JSON.stringify({flow,outputId:"out",intervalMinutes:15,enabled:false})
          });
          assert.equal((await disabled.json()).schedule.enabled,false);
          const removed = await fetch(base+"/"+key,{method:"DELETE",headers});
          assert.equal(removed.status,200);
          assert.equal((await fetch(base+"/"+key,{headers})).status,404);
          console.log("Flow schedules API CRUD and run-now verified");
          '
      - name: Verify authenticated API source listing
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const base = "http://127.0.0.1:3001/api/flow-sources/api/sources";
          assert.equal((await fetch(base)).status,403);
          const result = await fetch(base,{
            headers:{"x-hydria-flow-token":"ci-flow-results-token"}
          });
          assert.equal(result.status,200);
          assert.deepEqual((await result.json()).sources,[]);
          console.log("Managed API source catalog requires server token.");
          '
      - name: Validate DOCX PDF XLSX and PPTX roundtrip exports
        run: node backend/scripts/osExportSmoke.mjs
      - name: Verify PowerPoint embedded image export and limits
        run: node backend/scripts/pptxImageExportGate.mjs
      - name: Strict 51-case adversarial API regression gate
        run: HYDRIA_BUGHUNT_STRICT=1 node backend/scripts/osBugHuntApi.mjs
      - name: Upload strict API regression findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-api-validation-regression
          path: /tmp/hydria-bughunt/api.json
          retention-days: 7
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npx --prefix backend playwright install --with-deps chromium
      - name: Start Hydria for visual smoke tests
        run: |
          npm run start --prefix backend > /tmp/hydria-visual.log 2>&1 &
          ready=false
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/hydria-visual.log; exit 1; fi
          curl --fail --silent --show-error -X POST http://127.0.0.1:3001/api/users -H "Content-Type: application/json" -d '{"username":"hydria-visual-ci"}'
      - name: Production browser authentication and workspace smoke
        run: node backend/scripts/productionBrowserGate.mjs
      - name: Check product chrome JavaScript syntax
        run: node --check frontend/components/osProductChrome.js
      - name: Product UI desktop and mobile acceptance
        run: node backend/scripts/osProductUiGate.mjs
      - name: Mobile editing and action confirmation
        run: node backend/scripts/osAuditUxGate.mjs
      - name: Upload product UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-product-ui-visual-review
          path: /tmp/hydria-product-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Real Flow Manager pointer and keyboard acceptance
        run: node backend/scripts/osFlowCanvasInteractionGate.mjs
      - name: Flow Manager gesture visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-flow-drag-keyboard
          path: /tmp/hydria-flow-interactions.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Workspace workflow family routing
        run: node backend/scripts/osWorkspaceWorkflowRoutingGate.mjs
      - name: Whiteboard keyboard movement and text editing protection
        run: node backend/scripts/osCanvasKeyboardGate.mjs
      - name: Upload whiteboard keyboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-whiteboard-keyboard
          path: /tmp/hydria-canvas-keyboard.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Linked published Sheets and Dashboard open from deep links
        run: node backend/scripts/osFlowPublicationLinkGate.mjs
      - name: Six editor workbenches and functional inspector checks
        run: node backend/scripts/osEditorWorkbenchGate.mjs
      - name: Shared nested menus keyboard navigation
        run: node backend/scripts/osSharedMenuKeyboardGate.mjs
      - name: Upload workbench review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-os-six-editor-workbenches
          path: /tmp/hydria-workbench-review/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Test Docs Sheets and Slides after harmonisation
        run: npm run test:visual-workspace --prefix backend -- --scenario "shared-command-adapters,docs-shared-menu-definitions,docs-context-menu-helper,sheets-toolbar-context-menu-fullscreen,slides-presentation-smoke,canvas-whiteboard-smoke,dashboard-editor-smoke,dataflow-workbench-smoke,os-global-command-palette,os-project-explorer,os-per-file-tree-smoke,shared-icons,shared-context-menu-helper,docs-word-review-layout,docs-context-format-page-break"
      - name: Hydria Drive browser navigation and creation
        run: node backend/scripts/osDriveBrowserGate.mjs
      - name: Inline Drive filename rename and keyboard acceptance
        run: node backend/scripts/osDriveRenameBrowserGate.mjs
      - name: Global command search reaches native Drive assets
        run: node backend/scripts/osDriveAssetSearchBrowserGate.mjs
      - name: Real PdfCraft WASM edit, save and reopen
        run: |
          sudo apt-get install -y qpdf poppler-utils
          node backend/scripts/installPdfCraft.mjs
          node backend/scripts/osPdfCraftRealBrowserGate.mjs
          rm -r frontend/vendor/pdfcraft
      - name: Upload PDF save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-pdf-save-real-wasm
          path: /tmp/hydria-pdf-save/
          retention-days: 7
          if-no-files-found: ignore
      - name: PDF Studio missing-runtime fallback and PDF Blob handoff
        run: node backend/scripts/osPdfCraftBrowserGate.mjs
      - name: PhotoCraft and FigCraft browser and image Drive acceptance
        run: node backend/scripts/osArtCraftBrowserGate.mjs
      - name: Native FigCraft project import, revision history and Drive navigation
        run: node backend/scripts/osFigCraftDriveBrowserGate.mjs
      - name: Verify native PhotoCraft browser test source syntax
        run: node --check backend/scripts/osPhotoCraftProjectsBrowserGate.mjs
      - name: Native PhotoCraft project import and Drive revision history
        run: node backend/scripts/osPhotoCraftProjectsBrowserGate.mjs

  creative-browser:
    name: Native ArtCraft Drive integration
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npx --prefix backend playwright install --with-deps chromium
      - name: Start isolated Hydria private-pilot integration instance
        run: |
          npm run start --prefix backend > /tmp/hydria-artcraft-ci.log 2>&1 &
          ready=false
          for i in {1..35}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then cat /tmp/hydria-artcraft-ci.log; exit 1; fi
      - name: Test native pickers, direct saves and recovery in Chromium
        run: node backend/scripts/osArtCraftHostBridgeBrowserGate.mjs
      - name: Rust toolchain for source-pinned FigCraft adapter
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Clone and patch pinned FigCraft Rust source
        run: |
          mkdir -p .third_party
          git clone --depth=1 --branch v0.8.0 https://github.com/storytold/figcraft.git .third_party/figcraft
          test "$(git -C .third_party/figcraft rev-parse HEAD)" = "594dc8c6cf50a03b6d88abce877794f286f759b9"
          node backend/scripts/patchHydriaFigCraft.mjs .third_party/figcraft
      - name: Cache verified pinned FigCraft Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .third_party/figcraft -> target
          key: hydria-figcraft-v0.8.0-native-bridge
          cache-on-failure: true
      - name: Typecheck real FigCraft WebAssembly after Rust patch
        run: cargo check --manifest-path .third_party/figcraft/Cargo.toml -p figcraft-web --target wasm32-unknown-unknown
      - name: Build genuine Hydria-patched FigCraft WebAssembly
        run: |
          cargo install trunk --locked --version 0.21.14
          (cd .third_party/figcraft/apps/figcraft-web && trunk build --release)
          node backend/scripts/prepareHydriaFigCraftBuild.mjs .third_party/figcraft frontend/vendor/figcraft
      - name: Verify compiled FigCraft survives production frontend packaging
        run: |
          node backend/scripts/buildFrontend.mjs
          test -f frontend-dist/vendor/figcraft/index.html
          test -f frontend-dist/vendor/figcraft/LICENSE-FIGCRAFT-MIT.txt
          test -f frontend-dist/vendor/figcraft/LICENSE-FIGCRAFT-APACHE.txt
          grep -Fq 'data-hydria-fig-native="1"' frontend-dist/vendor/figcraft/index.html
          grep -Fq '/artcraft/hydria-bridge.js' frontend-dist/vendor/figcraft/index.html
          test "$(find frontend-dist/vendor/figcraft -maxdepth 1 -name '*_bg.wasm' | wc -l)" -ge 1
      - name: Authentic pinned PhotoCraft and source-patched FigCraft engines
        run: |
          node backend/scripts/installArtCraftWeb.mjs photo
          node backend/scripts/osArtCraftRealWasmBrowserGate.mjs

      - name: Upload genuine WASM editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-real-artcraft-drive-wasm
          path: artifacts/hydria-real-*.png
          retention-days: 7
          if-no-files-found: ignore

  pdf-readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npx --prefix backend playwright install --with-deps chromium
      - run: sudo apt-get install -y qpdf poppler-utils
      - run: node backend/scripts/installPdfCraft.mjs
      - name: PDF reader offset and attachment regression
        run: node backend/scripts/osPdfReaderGate.mjs
      - name: Three authentic WASM saves and independent PDF readers
        run: node backend/scripts/runLocalValidation.mjs osPdfCraftRealBrowserGate osPdfCraftRealBrowserGate osPdfCraftRealBrowserGate
      - name: Retain synthetic PDF readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-pdf-readback-evidence
          path: /tmp/hydria-pdf-save/
          retention-days: 7
          if-no-files-found: ignore
