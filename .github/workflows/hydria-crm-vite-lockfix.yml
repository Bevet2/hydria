name: Repair CRM Vite lockfile (one-off)
on:
  push:
    branches: [test/crm-embedded-workspace-coverage-20261021]
    paths: [.github/workflows/hydria-crm-vite-lockfix.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild exact secure Vite 6.4.5 dependency lock
        working-directory: crm
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@6.4.5 -w @northstar/web
      - name: Verify npm install is reproducible and audit has no high findings
        working-directory: crm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Commit only the resolved package manifest and integrity-locked dependency
        run: |
          git config user.name "hydria-dependency-bot"
          git config user.email "98226545+Bevet2@users.noreply.github.com"
          git add crm/apps/web/package.json crm/package-lock.json
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(crm): pin patched Vite 6.4.5 with verified npm lockfile"
          git push origin HEAD:test/crm-embedded-workspace-coverage-20261021
