name: Hydria OS ephemeral visual preview
on:
  push:
    branches:
      - preview/hydria-os-chat
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install runtime and Chromium
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npx --prefix backend playwright install --with-deps chromium
      - name: Launch Hydria OS (isolated demo data)
        run: |
          LOCAL_LLM_ENABLED=false ENABLE_LOCAL_TOOLS=false npm run start --prefix backend > /tmp/hydria-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3001/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3001/api/health
          curl --fail --silent --show-error -X POST http://127.0.0.1:3001/api/users \
            -H "Content-Type: application/json" -d '{"username":"Hydria Demo"}'
      - name: Capture real app screens
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from './backend/node_modules/playwright/index.mjs';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1365,height:850},deviceScaleFactor:1});
          page.on('pageerror',err=>console.log('PAGE_ERROR',String(err).slice(0,400)));
          const screens = [
            ['accueil','http://127.0.0.1:3001/'],
            ['documents','http://127.0.0.1:3001/workspace/docs'],
            ['tableurs','http://127.0.0.1:3001/workspace/sheets'],
            ['flux','http://127.0.0.1:3001/workspace/flows'],
            ['canvas','http://127.0.0.1:3001/workspace/canvas']
          ];
          await fs.mkdir('/tmp/hydria-preview-screens',{recursive:true});
          for(const [name,url] of screens){
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(2100);
              const image = await page.screenshot({type:'jpeg',quality:52,fullPage:false});
              await fs.writeFile('/tmp/hydria-preview-screens/'+name+'.jpg', image);
              console.log('REAL_SCREEN_START:'+name);
              console.log(image.toString('base64'));
              console.log('REAL_SCREEN_END:'+name);
              console.log('SCREEN_META:'+name+':'+await page.title()+':'+image.length);
            }catch(err){console.log('SCREEN_ERROR:'+name+':'+String(err));}
          }
          await browser.close();
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydria-os-real-preview
          path: /tmp/hydria-preview-screens/*.jpg
          retention-days: 7
